name: Bug report
description: Report unsafe, incorrect, or confusing skill behavior
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Do not include credentials, private repository content, or exploitable vulnerability details. Use Private Vulnerability Reporting for security issues.
  - type: textarea
    id: scenario
    attributes:
      label: Scenario
      description: What kind of change request, repository, and agent host were involved?
      placeholder: Codex running the skill on a yellow-risk GitHub pull request...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should the skill have done?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead? Redact all sensitive information.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v1.0.0 or a commit SHA
  - type: dropdown
    id: agent
    attributes:
      label: Agent host
      options:
        - Codex
        - Claude Code
        - Other Agent Skills-compatible host
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Safe reproduction evidence
      description: Include the smallest sanitized reproduction, validation output, or failure state.
